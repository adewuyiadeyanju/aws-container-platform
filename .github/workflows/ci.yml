name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "506813471880"
  ECR_REPOSITORY: fieldops-api
  ECS_CLUSTER: aws-container-platform-dev-cluster
  ECS_SERVICE: aws-container-platform-dev-fieldops-api

jobs:

  # =========================================================
  # 1. TESTING APPLICATION
  # =========================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldopstest

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U fieldops -d fieldops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: application

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: fieldops
      DATABASE_USERNAME: fieldops
      DATABASE_PASSWORD: fieldopstest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -q


  # =========================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # =========================================================

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506813471880:role/aws-container-platform-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: application
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # =========================================================
  # 3. TERRAFORM DEPLOYMENT
  # =========================================================

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build

    # Terraform apply only runs for pushes to main.
    # Pull requests will not modify AWS infrastructure.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506813471880:role/aws-container-platform-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="image_tag=${{ github.sha }}"

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${{ github.sha }}"


  # =========================================================
  # 4. VERIFY DEPLOYMENT
  # =========================================================

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506813471880:role/aws-container-platform-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Get ALB URL
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names aws-container-platform-dev-alb \
            --region "$AWS_REGION" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "url=http://$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Verify application health
        run: |
          echo "Checking application health..."

          for i in {1..12}; do

            if curl --fail --silent \
              "${{ steps.alb.outputs.url }}/health"; then

              echo
              echo "Application health check passed."
              break
            fi

            echo "Application not ready yet. Attempt $i/12..."
            sleep 10

            if [ "$i" -eq 12 ]; then
              echo "Application health check failed."
              exit 1
            fi

          done

      - name: Verify database health
        run: |
          echo "Checking database connectivity..."

          for i in {1..12}; do

            RESPONSE=$(curl \
              --silent \
              "${{ steps.alb.outputs.url }}/health/database")

            echo "Response: $RESPONSE"

            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Database health check passed."
              exit 0
            fi

            echo "Database not healthy yet. Attempt $i/12..."
            sleep 10

          done

          echo "Database health check failed."
          exit 1