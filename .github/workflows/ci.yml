name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldopstest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldops -d fieldops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: application

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: fieldops
      DATABASE_USERNAME: fieldops
      DATABASE_PASSWORD: fieldopstest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -q

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: application
        run: |
          docker build \
            --tag fieldops-api:${{ github.sha }} \
            .